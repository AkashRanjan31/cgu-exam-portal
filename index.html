      rel="icon"

    />

      no Google tracking). In a fully offline/intranet deployment, download the
      font files and serve them from /public/fonts/ instead.
    -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700,800&display=swap"

    />
